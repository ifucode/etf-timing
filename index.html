<meta charset="UTF-8">

<title>ETF择时</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#888;--line:#e6e6e6;--hdr:#fafafa;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft Yahei",sans-serif;background:var(--bg);color:var(--fg);font-size:13px;}
header{padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);z-index:5;}
h1{font-size:17px;margin:0 0 4px;}
.desc{color:var(--muted);font-size:12px;margin:4px 0 8px;line-height:1.5;}
.desc code{background:#f3f3f3;padding:1px 4px;border-radius:4px;font-size:11px;}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#eef;color:#225;}
.badge.live{background:#fee;color:#c22;}
button{cursor:pointer;border:1px solid #ccc;background:#fff;border-radius:6px;padding:4px 12px;font-size:12px;}
button:hover{background:#f3f3f3;}
#status{padding:10px 18px;color:var(--muted);font-size:12px;}
.wrap{overflow:auto;max-height:calc(100vh - 150px);padding:0 18px 24px 0;}
.wrap::before{content:"";position:fixed;left:0;top:0;bottom:0;width:18px;background:#fff;z-index:20;pointer-events:none;}
table{border-collapse:collapse;font-size:11px;white-space:nowrap;}
th,td{border:1px solid var(--line);padding:3px 5px;text-align:center;height:26px;}
thead th{position:sticky;top:0;background:#fff;z-index:2;font-weight:600;}
thead th:first-child,tbody th:first-child{position:sticky;left:0;background:#fff;z-index:3;text-align:left;min-width:150px;padding-left:18px;}
thead th:first-child{z-index:4;}
.name{font-weight:600;}
.code{color:var(--muted);font-size:10px;font-weight:400;}
.latest{font-weight:700;font-size:12px;}
.na{color:#bbb;}
.legend{display:inline-flex;gap:6px;align-items:center;margin-left:4px;}
.swatch{width:14px;height:12px;display:inline-block;border:1px solid #ddd;vertical-align:middle;}
th.sep,td.sep{background:#fff !important;border-left:2px solid #ccc;}
th.delta,td.delta{background:#f7f7f9;font-weight:700;font-size:14px;min-width:30px;line-height:1;}
.up{color:#d62828;}      /* ▲ 较前日增大 = 涨 = 红 */
.down{color:#1a1a1a;}    /* ▼ 较前日减小 = 黑 */
.flat{color:#999;}
</style>
</head>

// 数据由本地管线 fetch_data.py 烤入（见 ETF_DATA），页面打开即直接渲染快照，不在线拉取。
function renderSnapshot(d){
  const cols = d.tradeDates;
  const weekDates = d.weekDates || [];
  const live = false;
  const rowsData = d.rows.map(r=>{
    const moms = Object.assign({}, r.moms);
    const a2x = Object.assign({}, r.a2x || {});
    if(live && r.live!=null){ moms[cols[cols.length-1]] = r.live; }
    if(live && r.liveA2x!=null){ a2x[cols[cols.length-1]] = r.liveA2x; }
    const latest = (live && r.live!=null) ? r.live : r.latest;
    return { code:r.code, name:r.name, error:false, moms, a2x, latest, weekMoms: r.weekMoms || {} };
  });
  rowsData.sort((a,b)=> (b.latest==null?-1e9:b.latest) - (a.latest==null?-1e9:a.latest));
  render({ cols, rowsData, live, weekDates });
}
function colorFor(v, scale){
  if(v==null) return 'background:#fafafa;color:#bbb';
  const t = Math.max(-1, Math.min(1, v/scale));
  if(t>=0){ const a=0.12+0.78*t; return `background:rgba(214,40,40,${a.toFixed(3)})`; }
  const a=0.12+0.78*(-t); return `background:rgba(40,120,220,${a.toFixed(3)});color:#06243f`;   // 负斜率：蓝
}
// 文华多空信号：看多(A1X>=0) / 逃顶(A1X<0 且 A2X<0)，其余为空头(未逃顶)
function signalFor(a1x, a2x){
  if(a1x==null) return null;
  if(a1x >= 0) return 'long';
  if(a2x!=null && a2x < 0) return 'escape';
  return null;
}
const SIG_LABEL = { long:'看多', escape:'逃顶' };
function deltaArrow(cur, prev){
  if(cur==null || prev==null) return '<span class="flat">·</span>';
  if(cur > prev) return '<span class="up" title="较前日 A1X 增大">▲</span>';
  if(cur < prev) return '<span class="down" title="较前日 A1X 减小">▼</span>';
  return '<span class="flat" title="较前日 A1X 持平">＝</span>';
}
function cellStyle(v, v2, scale){
  if(v==null) return 'background:#fafafa;color:#bbb';
  const sig = signalFor(v, v2);
  if(sig){
    const t = Math.max(0, Math.min(1, Math.abs(v)/scale));
    const a = (0.30 + 0.65*t).toFixed(3);
    if(sig==='long') return `background:rgba(255,153,0,${a});color:#3a1f00;box-shadow:inset 0 0 0 2px rgba(200,40,40,.85)`;
    return `background:rgba(40,120,220,${a});color:#06243f`;   // 逃顶/空仓：蓝
  }
  return colorFor(v, scale);
}
function render(M){
  const {cols, rowsData, live, weekDates=[]} = M;
  const vals = [];
  rowsData.forEach(r=>cols.forEach(d=>{ if(r.moms[d]!=null) vals.push(r.moms[d]); }));
  vals.sort((a,b)=>a-b);
  const scale = Math.max(0.5, Math.abs(vals[Math.floor(vals.length*0.9)]||1));
  const wvals = [];
  rowsData.forEach(r=>{ if(r.weekMoms) weekDates.forEach(wd=>{ const v=r.weekMoms[wd]; if(v!=null) wvals.push(v); }); });
  wvals.sort((a,b)=>a-b);
  const wscale = wvals.length ? Math.max(0.5, Math.abs(wvals[Math.floor(wvals.length*0.9)]||1)) : 1;
  const tbl = document.getElementById('matrix');
  const fmt = d => d.slice(5);
  let html = '<thead><tr><th>ETF / 最新动量(A1X%)</th>';
  cols.forEach((d,i)=>{
    const tag = (live && i===cols.length-1) ? ' 🔴' : '';
    html += `<th>${fmt(d)}${tag}</th>`;
  });
  html += '<th class="delta" title="较前一交易日 A1X 变化方向：▲增大 / ▼减小">Δ</th>';
  if(weekDates.length){
    html += '<th class="sep"></th>';
    weekDates.forEach(d=>{ html += `<th>${fmt(d)}周</th>`; });
  }
  html += '</tr></thead><tbody>';
  // 均值行：放第一行，随内容滚动
  const avgArr = cols.map(d=>{
    const arr = rowsData.map(r=>r.moms[d]).filter(v=>v!=null);
    return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  });
  const avgArr2 = cols.map(d=>{
    const arr = rowsData.map(r=>r.a2x[d]).filter(v=>v!=null);
    return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  });
  const avgLast = avgArr[avgArr.length-1];
  html += '<tr>';
  html += `<th><span class="name">均值</span><br><span class="latest" style="${avgLast==null?'':cellStyle(avgLast, avgArr2[avgArr2.length-1], scale)}">${avgLast==null?'—':avgLast.toFixed(2)}</span></th>`;
  cols.forEach((d,i)=>{
    const avg = avgArr[i], avg2 = avgArr2[i];
    if(avg==null){ html += '<td class="na">·</td>'; }
    else { const sg=signalFor(avg,avg2); html += `<td style="${cellStyle(avg,avg2,scale)}" title="均值 ${d}: A1X ${avg.toFixed(2)}% / A2X ${(avg2==null?'—':avg2.toFixed(2))}%${sg?' · 信号:'+SIG_LABEL[sg]:''}">${avg.toFixed(2)}</td>`; }
  });
  const mCur = avgArr[avgArr.length-1], mPrev = avgArr[avgArr.length-2];
  html += `<td class="delta">${deltaArrow(mCur, mPrev)}</td>`;
  if(weekDates.length){
    const avgW = weekDates.map(wd=>{
      const arr = rowsData.map(r=>r.weekMoms && r.weekMoms[wd]).filter(v=>v!=null);
      return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
    });
    html += '<td class="sep"></td>';
    weekDates.forEach((wd,i)=>{
      const avg = avgW[i];
      if(avg==null){ html += '<td class="na">·</td>'; }
      else { html += `<td style="${cellStyle(avg,null,wscale)}" title="周均值 ${wd}: A1X ${avg.toFixed(2)}%">${avg.toFixed(2)}</td>`; }
    });
  }
  html += '</tr>';
  // 各 ETF 行
  rowsData.forEach(r=>{
    html += '<tr>';
    const lv = r.latest==null ? '—' : r.latest.toFixed(2);
    const lvColor = r.latest==null?'':cellStyle(r.latest, r.a2x[cols[cols.length-1]], scale);
    html += `<th><span class="name">${r.name||r.code}</span> <span class="code">${r.code}</span><br><span class="latest" style="${lvColor}">${lv}</span></th>`;
    cols.forEach(d=>{
      const v = r.moms[d], v2 = r.a2x[d];
      if(v==null){ html += '<td class="na">·</td>'; }
      else { const sg=signalFor(v,v2); html += `<td style="${cellStyle(v,v2,scale)}" title="${r.name} ${d}: A1X ${v.toFixed(2)}% / A2X ${(v2==null?'—':v2.toFixed(2))}%${sg?' · 信号:'+SIG_LABEL[sg]:''}">${v.toFixed(2)}</td>`; }
    });
    const cur = r.moms[cols[cols.length-1]], prev = r.moms[cols[cols.length-2]];
    html += `<td class="delta">${deltaArrow(cur, prev)}</td>`;
    if(weekDates.length){
      html += '<td class="sep"></td>';
      weekDates.forEach(wd=>{
        const v = r.weekMoms ? r.weekMoms[wd] : null;
        if(v==null){ html += '<td class="na">·</td>'; }
        else { const sg=signalFor(v,null); html += `<td style="${cellStyle(v,null,wscale)}" title="${r.name} ${wd}(周): A1X ${v.toFixed(2)}%${sg?' · 信号:'+SIG_LABEL[sg]:''}">${v.toFixed(2)}</td>`; }
      });
    }
    html += '</tr>';
  });
  html += '</tbody>';
  tbl.innerHTML = html;
  document.getElementById('updated').textContent = '更新于 ' + new Date().toLocaleString('zh-CN');
  document.getElementById('status').textContent = `完成：${rowsData.filter(r=>!r.error).length}/${rowsData.length} 只成功，列=${cols.length} 个交易日`;
}
function showErr(msg){
  document.getElementById('status').innerHTML = '<span style="color:#c22">' + msg + '</span>';
}
window.addEventListener('error', e => showErr('页面错误：' + (e.message||e.error)));
window.addEventListener('unhandledrejection', e => { const r = e.reason; showErr('未捕获异常：' + (r && r.message ? r.message : r)); });
// 打开即直接渲染内嵌快照（数据由本地 fetch_data.py 烤入），不在线拉取
if(ETF_DATA){ renderSnapshot(ETF_DATA); }
else { document.getElementById('status').textContent = '无数据'; }
</script>
