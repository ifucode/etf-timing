name: 更新 ETF择时 看板

# 触发：每个交易日收盘后自动重算 + 手动触发 + 首次推送
on:
  schedule:
    # 周一至周五 15:30 北京时间 = UTC 07:30（A股收盘后抓取）
    - cron: '30 7 * * 1-5'
  workflow_dispatch:        # 网页/Actions 标签手动触发
  push:
    branches: [main]        # 首次推送或改代码时部署

# 部署 Pages 需要写权限 + OIDC
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python（仅标准库，无需安装依赖）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 重新抓取行情并生成矩阵
        run: python fetch_data.py

      - name: 提交最新快照回仓库（[skip ci] 避免循环触发）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          git commit -m "chore: 自动更新行情 $(TZ=Asia/Shanghai date +'%F %T') [skip ci]" || echo "无变更，跳过提交"
          git push

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
